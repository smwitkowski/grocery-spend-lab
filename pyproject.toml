[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-spend-lab"
version = "0.2.0"
description = "Local-first grocery receipt export and spending analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephen Witkowski" }]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "seaborn>=0.13,<1",
]

[project.scripts]
grocery-spend = "grocery_spend_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grocery_spend_lab = ["schemas/*.json"]
